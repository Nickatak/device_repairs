# SUPERSEDED 2026-07-29 — dock01 runs docker-compose.prod.yml (symlinked as
# docker-compose.override.yml), which carries these ports itself plus the prod
# commands. The -f stacking this file needed was a footgun: a bare
# `docker compose up` silently unpublished the ports. Kept only for running
# dock01 in DEV mode with ports:
#   docker compose -f docker-compose.yml -f docker-compose.homelab.yml up -d
services:
  backend:
    ports:
      - "${BACKEND_PORT:-8000}:8000"

  frontend:
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
